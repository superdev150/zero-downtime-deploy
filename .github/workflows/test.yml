name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/deploy.sh tests/test-deploy.sh example/post-deploy.sh
      - name: simulate deploys against a local "server"
        run: bash tests/test-deploy.sh
